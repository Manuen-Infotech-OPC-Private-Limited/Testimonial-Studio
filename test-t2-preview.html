<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 20px; background: #334155; display: flex; justify-content: center; }
  .canvas { width: 512px; height: 768px; position: relative; background: #FFFEFC; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
</style>
</head>
<body>
<div class="canvas">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Base Warm White/Ivory Gradient -->
    <linearGradient id="t2-base-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FFFEFC" />
      <stop offset="100%" stop-color="#FFFDF9" />
    </linearGradient>

    <!-- Metallic Gold Gradient for Borders & Ribbons -->
    <linearGradient id="t2-gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C5E0E" />
      <stop offset="18%" stop-color="#D9A833" />
      <stop offset="38%" stop-color="#FFF3B8" />
      <stop offset="55%" stop-color="#D9A833" />
      <stop offset="72%" stop-color="#9C6B14" />
      <stop offset="88%" stop-color="#FFE89C" />
      <stop offset="100%" stop-color="#8C5E0E" />
    </linearGradient>

    <!-- Horizontal Metallic Gold for Top-Left Corner Bands -->
    <linearGradient id="t2-gold-tl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C6B14" />
      <stop offset="25%" stop-color="#E2B43E" />
      <stop offset="50%" stop-color="#FFF4BE" />
      <stop offset="75%" stop-color="#E2B43E" />
      <stop offset="100%" stop-color="#8C5E0E" />
    </linearGradient>

    <!-- Deep Brown/Bronze Corner Gradient (135deg) -->
    <linearGradient id="t2-bronze-corner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A170C" />
      <stop offset="50%" stop-color="#5C2513" />
      <stop offset="100%" stop-color="#7A3219" />
    </linearGradient>

    <!-- Dark Reddish-Brown Bottom Wave Gradient -->
    <linearGradient id="t2-wave-brown" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#280E07" />
      <stop offset="35%" stop-color="#4F1C0E" />
      <stop offset="70%" stop-color="#6F2814" />
      <stop offset="100%" stop-color="#8A3319" />
    </linearGradient>

    <!-- Ribbon Drop Shadow -->
    <filter id="t2-shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#140702" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- 1. Base Warm White/Ivory Fill -->
  <rect width="1024" height="1536" fill="url(#t2-base-gradient)" />

  <!-- 2. Outer Thin Metallic-Gold Border (approx 4-6px) around all four edges -->
  <rect x="2.5" y="2.5" width="1019" height="1531" fill="none" stroke="url(#t2-gold-gradient)" stroke-width="5" />

  <!-- 3. Top-Left Sweeping Curved Corner Accent -->
  <g id="t2-top-left-accent">
    <!-- Deep Brown/Bronze Corner Fill -->
    <path
      d="M 0 0 L 145 0 C 105 25, 28 85, 0 102 Z"
      fill="url(#t2-bronze-corner)"
    />

    <!-- First Metallic Gold Band -->
    <g filter="url(#t2-shadow)">
      <path
        d="M 145 0 C 105 25, 28 85, 0 102 L 0 114 C 32 96, 115 34, 158 0 Z"
        fill="url(#t2-gold-tl)"
      />
      <!-- Specular Highlight Line -->
      <path
        d="M 145 0 C 105 25, 28 85, 0 102"
        fill="none"
        stroke="#FFF9DF"
        stroke-width="1.2"
        stroke-opacity="0.9"
      />
    </g>

    <!-- Deep Brown Thin Hairline Gap (1.5px) -->
    <path
      d="M 158 0 C 115 34, 32 96, 0 114 L 0 116 C 33 98, 117 35, 160 0 Z"
      fill="#280E07"
    />

    <!-- Second Metallic Gold Band -->
    <g filter="url(#t2-shadow)">
      <path
        d="M 160 0 C 117 35, 33 98, 0 116 L 0 128 C 38 108, 128 42, 176 0 Z"
        fill="url(#t2-gold-tl)"
      />
      <!-- Specular Highlight Line -->
      <path
        d="M 160 0 C 117 35, 33 98, 0 116"
        fill="none"
        stroke="#FFF9DF"
        stroke-width="1.2"
        stroke-opacity="0.9"
      />
    </g>
  </g>

  <!-- 4. Bottom Flowing Dark Reddish-Brown Wave with Narrow Metallic Gold Ribbon -->
  <g id="t2-bottom-wave-accent">
    <!-- Wide Dark Reddish-Brown Wave Body -->
    <path
      d="M 0 1285 C 160 1400, 380 1475, 600 1495 C 750 1510, 900 1506, 1024 1504 L 1024 1536 L 0 1536 Z"
      fill="url(#t2-wave-brown)"
    />

    <!-- Narrow Metallic-Gold Ribbon along Upper Edge -->
    <g filter="url(#t2-shadow)">
      <path
        d="M 0 1285 C 160 1400, 380 1475, 600 1495 C 750 1510, 900 1506, 1024 1504 L 1024 1514 C 900 1516, 750 1520, 600 1507 C 380 1489, 160 1418, 0 1305 Z"
        fill="url(#t2-gold-gradient)"
      />
      <!-- Specular White-Gold Rim along Top Contour -->
      <path
        d="M 0 1285 C 160 1400, 380 1475, 600 1495 C 750 1510, 900 1506, 1024 1504"
        fill="none"
        stroke="#FFF8DA"
        stroke-width="1.6"
        stroke-opacity="0.95"
      />
      <!-- Bronze Edge Accent along Lower Contour -->
      <path
        d="M 0 1305 C 160 1418, 380 1489, 600 1507 C 750 1520, 900 1516, 1024 1514"
        fill="none"
        stroke="#593906"
        stroke-width="1"
        stroke-opacity="0.75"
      />
    </g>
  </g>
</svg>
</div>
</body>
</html>
