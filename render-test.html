<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Render Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #222; display: flex; justify-content: center; align-items: center; width: 800px; height: 1200px; overflow: hidden; }
    .testimonial-poster {
      position: relative;
      width: 800px;
      height: 1200px;
      background: #fffdf7;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="testimonial-poster">
    <svg
      class="testimonial-background"
      viewBox="0 0 800 1200"
      preserveAspectRatio="none"
      aria-hidden="true"
      style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0;"
    >
      <defs>
        <!-- 1. Base Luxury Ivory Paper Gradient -->
        <linearGradient id="t1-paper-base" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FFFFFF" />
          <stop offset="15%" stop-color="#FFFDF9" />
          <stop offset="40%" stop-color="#FDFBF5" />
          <stop offset="70%" stop-color="#F9F2E3" />
          <stop offset="90%" stop-color="#F7EADB" />
          <stop offset="100%" stop-color="#F4E2CA" />
        </linearGradient>

        <!-- 2. Panoramic Celestial Sky-Blue Atmosphere (Top & Upper Quadrants) -->
        <radialGradient id="t1-top-sky-glow" cx="50%" cy="0%" r="58%">
          <stop offset="0%" stop-color="#8CC0F8" stop-opacity="0.85" />
          <stop offset="25%" stop-color="#B3DAFA" stop-opacity="0.6" />
          <stop offset="55%" stop-color="#DCF0FE" stop-opacity="0.32" />
          <stop offset="80%" stop-color="#F5FAFF" stop-opacity="0.12" />
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
        </radialGradient>

        <!-- Side Blue Glows framing left and right upper edges -->
        <radialGradient id="t1-upper-left-blue" cx="0%" cy="18%" r="42%">
          <stop offset="0%" stop-color="#A8D4FC" stop-opacity="0.65" />
          <stop offset="60%" stop-color="#D4EAFC" stop-opacity="0.25" />
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
        </radialGradient>

        <radialGradient id="t1-upper-right-blue" cx="100%" cy="18%" r="42%">
          <stop offset="0%" stop-color="#B3DCFC" stop-opacity="0.6" />
          <stop offset="60%" stop-color="#DCEDFD" stop-opacity="0.22" />
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
        </radialGradient>

        <!-- 3. Golden Amber Flank Light Sweeps (Right & Left) -->
        <linearGradient id="t1-flank-right" x1="1" y1="0" x2="0" y2="0">
          <stop offset="0%" stop-color="#FBE5B4" stop-opacity="0.7" />
          <stop offset="35%" stop-color="#FDF0D2" stop-opacity="0.38" />
          <stop offset="70%" stop-color="#FFF9EB" stop-opacity="0.12" />
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
        </linearGradient>

        <linearGradient id="t1-flank-left" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#FBE5B4" stop-opacity="0.5" />
          <stop offset="40%" stop-color="#FDF0D2" stop-opacity="0.22" />
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
        </linearGradient>

        <!-- 4. Top-Left Navy Corner Gradient -->
        <linearGradient id="t1-corner-navy" x1="0" y1="0" x2="118" y2="118" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#01226B" />
          <stop offset="30%" stop-color="#00358A" />
          <stop offset="70%" stop-color="#02216A" />
          <stop offset="100%" stop-color="#01133D" />
        </linearGradient>

        <!-- 5. Top-Left Metallic Gold Ribbon Gradient -->
        <linearGradient id="t1-corner-gold" x1="140" y1="0" x2="0" y2="140" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#9C701B" />
          <stop offset="18%" stop-color="#E0B142" />
          <stop offset="38%" stop-color="#FFF6B5" />
          <stop offset="62%" stop-color="#C99827" />
          <stop offset="82%" stop-color="#FFEBA0" />
          <stop offset="100%" stop-color="#865D0F" />
        </linearGradient>

        <!-- 6. Bottom Sweeping Metallic Gold Ribbon Wave Gradient -->
        <linearGradient id="t1-wave-gold" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#8A6012" />
          <stop offset="15%" stop-color="#D5A233" />
          <stop offset="32%" stop-color="#FFF4AA" />
          <stop offset="50%" stop-color="#C79223" />
          <stop offset="68%" stop-color="#FFE99C" />
          <stop offset="85%" stop-color="#DCAB39" />
          <stop offset="100%" stop-color="#84590F" />
        </linearGradient>

        <!-- 7. Bottom-Left Navy Gradient with Seamless Natural Radial Fade -->
        <radialGradient id="t1-bottom-navy-radial" cx="12%" cy="98%" r="48%">
          <stop offset="0%" stop-color="#012773" stop-opacity="1" />
          <stop offset="35%" stop-color="#002264" stop-opacity="0.95" />
          <stop offset="60%" stop-color="#033A8C" stop-opacity="0.75" />
          <stop offset="82%" stop-color="#1C4B92" stop-opacity="0.35" />
          <stop offset="95%" stop-color="#5B7CA8" stop-opacity="0.1" />
          <stop offset="100%" stop-color="#F7EADB" stop-opacity="0" />
        </radialGradient>

        <!-- Filter: Drop Shadow for Gold Ribbons -->
        <filter id="t1-ribbon-shadow" x="-15%" y="-15%" width="130%" height="130%">
          <feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#120D02" flood-opacity="0.28" />
        </filter>

        <!-- Filter: Atmospheric Gaussian Blur for Flank Light Rays -->
        <filter id="t1-flank-blur" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="20" />
        </filter>
      </defs>

      <!-- --- LAYER 1: BASE LUXURY IVORY PAPER --- -->
      <rect width="800" height="1200" fill="url(#t1-paper-base)" />

      <!-- --- LAYER 2: CELESTIAL SKY-BLUE ATMOSPHERE --- -->
      <rect width="800" height="520" fill="url(#t1-top-sky-glow)" />
      <rect width="360" height="420" fill="url(#t1-upper-left-blue)" />
      <rect x="440" width="360" height="420" fill="url(#t1-upper-right-blue)" />

      <!-- Subtle diagonal sky-blue light stream -->
      <path
        d="M 160 0 L 320 0 L 100 420 L 0 420 L 0 260 Z"
        fill="#A6D2FA"
        opacity="0.22"
      />

      <!-- --- LAYER 3: WARM GOLDEN AMBER FLANK SWEEPS (RIGHT & LEFT) --- -->
      <g filter="url(#t1-flank-blur)">
        <!-- Right flank flowing golden light rays -->
        <path
          d="M 800 260 C 710 370, 660 510, 690 680 C 720 780, 760 840, 800 890 Z"
          fill="url(#t1-flank-right)"
        />
        <path
          d="M 800 360 C 740 450, 700 560, 725 680 C 750 760, 775 820, 800 850 Z"
          fill="url(#t1-flank-right)"
          opacity="0.8"
        />
        <!-- Left flank warm golden radiance -->
        <path
          d="M 0 300 C 65 410, 70 560, 0 700 Z"
          fill="url(#t1-flank-left)"
        />
      </g>

      <!-- --- LAYER 4: TOP-LEFT NAVY CORNER & METALLIC GOLD RIBBON ARC --- -->
      <!-- Deep Royal Navy Corner Arc -->
      <path
        d="M 0 0 L 118 0 C 92 42, 45 88, 0 118 Z"
        fill="url(#t1-corner-navy)"
      />

      <!-- Primary Metallic Gold Ribbon Band with Shadow -->
      <g filter="url(#t1-ribbon-shadow)">
        <path
          d="M 118 0 C 92 42, 45 88, 0 118 L 0 140 C 62 104, 108 55, 140 0 Z"
          fill="url(#t1-corner-gold)"
        />
        <!-- Specular Inner Highlight Rim -->
        <path
          d="M 118 0 C 92 42, 45 88, 0 118"
          fill="none"
          stroke="#FFFBE5"
          stroke-width="1.5"
          stroke-opacity="0.95"
        />
        <!-- Outer Bronze Rim -->
        <path
          d="M 140 0 C 108 55, 62 104, 0 140"
          fill="none"
          stroke="#604207"
          stroke-width="1"
          stroke-opacity="0.7"
        />
      </g>

      <!-- --- LAYER 5: BOTTOM-LEFT NAVY CORNER (NATURAL RADIAL FADE) --- -->
      <!-- Deep Navy Radial Fill under wave -->
      <path
        d="M 0 1026 C 65 1070, 125 1102, 188 1102 C 285 1102, 380 1060, 440 1020 L 450 1200 L 0 1200 Z"
        fill="url(#t1-bottom-navy-radial)"
      />

      <!-- Crisp dark navy accent line tracing under the ribbon -->
      <path
        d="M 0 1061 C 65 1092, 125 1126, 188 1126 C 285 1126, 380 1080, 440 1040"
        fill="none"
        stroke="#02143D"
        stroke-width="2.8"
      />

      <!-- Secondary lower gold accent reflection line under the trough -->
      <path
        d="M 80 1136 C 130 1144, 188 1144, 245 1130"
        fill="none"
        stroke="#D49925"
        stroke-width="1.5"
        stroke-opacity="0.75"
      />

      <!-- --- LAYER 6: BOTTOM MAJESTIC METALLIC GOLD RIBBON WAVE --- -->
      <g filter="url(#t1-ribbon-shadow)">
        <!-- Ribbon Body flowing from (0, 1026) to trough at (188, 1102) and up to (800, 902) -->
        <path
          d="M 0 1026
             C 65 1070, 125 1102, 188 1102
             C 285 1102, 420 1045, 560 978
             C 650 935, 730 910, 800 902
             L 800 938
             C 730 945, 650 968, 560 1010
             C 420 1078, 285 1135, 188 1126
             C 125 1115, 65 1085, 0 1061 Z"
          fill="url(#t1-wave-gold)"
        />

        <!-- Specular Top Rim Highlight -->
        <path
          d="M 0 1026
             C 65 1070, 125 1102, 188 1102
             C 285 1102, 420 1045, 560 978
             C 650 935, 730 910, 800 902"
          fill="none"
          stroke="#FFFEEA"
          stroke-width="1.8"
          stroke-opacity="0.95"
        />

        <!-- Bottom Bronze Edge Contour -->
        <path
          d="M 0 1061
             C 65 1085, 125 1115, 188 1126
             C 285 1135, 420 1078, 560 1010
             C 650 968, 730 945, 800 938"
          fill="none"
          stroke="#5A3D06"
          stroke-width="1.2"
          stroke-opacity="0.75"
        />
      </g>
    </svg>
  </div>
</body>
</html>
