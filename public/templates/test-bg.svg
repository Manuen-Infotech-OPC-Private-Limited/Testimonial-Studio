<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    {/* Base Luxury Ivory Paper Gradient */}
    <linearGradient id="t1-paper-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#FFFDF9" />
      <stop offset="50%" stop-color="#FCF8EF" />
      <stop offset="80%" stop-color="#FAF2E2" />
      <stop offset="100%" stop-color="#F6E8D0" />
    </linearGradient>

    {/* Celestial Atmospheric Blue Glow at Top */}
    <radialGradient id="t1-top-blue-glow" cx="50%" cy="-5%" r="55%">
      <stop offset="0%" stop-color="#93C8F9" stop-opacity="0.85" />
      <stop offset="25%" stop-color="#B8DCFA" stop-opacity="0.6" />
      <stop offset="55%" stop-color="#DEF0FD" stop-opacity="0.3" />
      <stop offset="80%" stop-color="#F2F8FE" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    {/* Diagonal Blue Sweep Accent */}
    <linearGradient id="t1-blue-sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A8D4FD" stop-opacity="0.4" />
      <stop offset="45%" stop-color="#D4EAFC" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    {/* Warm Golden Flank Auras */}
    <linearGradient id="t1-flank-right-grad" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#F5DBA3" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#FBF0D5" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="t1-flank-left-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5DBA3" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#FBF0D5" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    {/* Top-Left Navy Corner Gradient */}
    <linearGradient id="t1-corner-navy" x1="0" y1="0" x2="105" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#022974" />
      <stop offset="35%" stop-color="#00378D" />
      <stop offset="75%" stop-color="#032057" />
      <stop offset="100%" stop-color="#011438" />
    </linearGradient>

    {/* Top-Left Metallic Gold Ribbon Gradient */}
    <linearGradient id="t1-corner-gold" x1="125" y1="0" x2="0" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A4761E" />
      <stop offset="18%" stop-color="#E2B748" />
      <stop offset="42%" stop-color="#FFF5B2" />
      <stop offset="65%" stop-color="#C99B29" />
      <stop offset="85%" stop-color="#FFECA1" />
      <stop offset="100%" stop-color="#885E11" />
    </linearGradient>

    {/* Bottom Sweeping Metallic Gold Ribbon Wave Gradient */}
    <linearGradient id="t1-wave-gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#885E11" />
      <stop offset="14%" stop-color="#D4A030" />
      <stop offset="30%" stop-color="#FFF2A7" />
      <stop offset="48%" stop-color="#C48E21" />
      <stop offset="66%" stop-color="#FFE898" />
      <stop offset="84%" stop-color="#D8A535" />
      <stop offset="100%" stop-color="#82580E" />
    </linearGradient>

    {/* Bottom-Left Navy Gradient with Seamless Fade to Opacity 0 on the Right */}
    <linearGradient id="t1-bottom-navy-fade" x1="0" y1="0" x2="380" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#011848" stop-opacity="1" />
      <stop offset="35%" stop-color="#002D78" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#033888" stop-opacity="0.6" />
      <stop offset="85%" stop-color="#05459E" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#05459E" stop-opacity="0" />
    </linearGradient>

    {/* Ribbon Drop Shadow */}
    <filter id="t1-ribbon-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3.5" flood-color="#141004" flood-opacity="0.25" />
    </filter>

    <filter id="t1-blur-flank" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  {/* --- 1. BASE LUXURY IVORY PAPER --- */}
  <rect width="800" height="1200" fill="url(#t1-paper-base)" />

  {/* --- 2. TOP ATMOSPHERIC CELESTIAL BLUE GLOW --- */}
  <rect width="800" height="550" fill="url(#t1-top-blue-glow)" />

  {/* Pale diagonal blue sweep accent at top */}
  <path d="M 120 0 L 260 0 L 80 400 L 0 400 L 0 250 Z" fill="url(#t1-blue-sweep)" />

  {/* --- 3. WARM GOLDEN AMBER FLANK AURAS --- */}
  {/* Right flank sweeps */}
  <g filter="url(#t1-blur-flank)">
    <path
      d="M 800 280 C 720 380, 680 500, 710 660 C 730 760, 765 830, 800 870 Z"
      fill="url(#t1-flank-right-grad)"
    />
    <path
      d="M 800 380 C 750 470, 720 570, 745 680 C 765 760, 785 810, 800 840 Z"
      fill="url(#t1-flank-right-grad)"
      opacity="0.7"
    />
    {/* Left flank soft glow */}
    <path
      d="M 0 320 C 50 420, 55 560, 0 680 Z"
      fill="url(#t1-flank-left-grad)"
    />
  </g>

  {/* --- 4. TOP-LEFT NAVY CORNER & METALLIC GOLD RIBBON --- */}
  {/* Deep Royal Navy Corner */}
  <path
    d="M 0 0 L 105 0 C 85 24, 60 48, 0 72 Z"
    fill="url(#t1-corner-navy)"
  />

  {/* Top-Left Metallic Gold Ribbon Band with Shadow */}
  <g filter="url(#t1-ribbon-shadow)">
    <path
      d="M 105 0 C 85 24, 60 48, 0 72 L 0 92 C 72 64, 102 32, 125 0 Z"
      fill="url(#t1-corner-gold)"
    />
    {/* Specular Inner Rim */}
    <path
      d="M 105 0 C 85 24, 60 48, 0 72"
      fill="none"
      stroke="#FFF9DA"
      stroke-width="1.2"
      stroke-opacity="0.9"
    />
    {/* Outer Bronze Rim */}
    <path
      d="M 125 0 C 102 32, 72 64, 0 92"
      fill="none"
      stroke="#634509"
      stroke-width="0.8"
      stroke-opacity="0.65"
    />
  </g>

  {/* --- 5. BOTTOM-LEFT NAVY CORNER (FADING SEAMLESSLY TO IVORY) --- */}
  <path
    d="M 0 1045 C 60 1101, 110 1154, 170 1154 C 240 1154, 300 1125, 360 1095 L 380 1200 L 0 1200 Z"
    fill="url(#t1-bottom-navy-fade)"
  />

  {/* Crisp dark navy line right under the gold ribbon */}
  <path
    d="M 0 1045 C 60 1101, 110 1154, 170 1154 C 240 1154, 300 1125, 360 1095"
    fill="none"
    stroke="#01153D"
    stroke-width="2.5"
  />

  {/* --- 6. BOTTOM MAJESTIC METALLIC GOLD RIBBON WAVE --- */}
  <g filter="url(#t1-ribbon-shadow)">
    {/* Ribbon Body */}
    <path
      d="M 0 1029 C 60 1085, 110 1138, 170 1138 C 240 1138, 330 1100, 440 1038 C 550 976, 680 922, 800 908 L 800 924 C 680 938, 550 992, 440 1054 C 330 1116, 240 1154, 170 1154 C 110 1154, 60 1101, 0 1045 Z"
      fill="url(#t1-wave-gold)"
    />

    {/* Upper Edge Specular Highlight Rim */}
    <path
      d="M 0 1029 C 60 1085, 110 1138, 170 1138 C 240 1138, 330 1100, 440 1038 C 550 976, 680 922, 800 908"
      fill="none"
      stroke="#FFFBE5"
      stroke-width="1.4"
      stroke-opacity="0.95"
    />

    {/* Lower Edge Bronze Contour Rim */}
    <path
      d="M 0 1045 C 60 1101, 110 1154, 170 1154 C 240 1154, 330 1116, 440 1054 C 550 992, 680 938, 800 924"
      fill="none"
      stroke="#5E4007"
      stroke-width="0.9"
      stroke-opacity="0.75"
    />
  </g>
</svg>

